name: CI

# Run the unit tests on every push and pull request, so regressions in the
# battery-estimate maths and the HID driver parsing get caught before they land.
# The tests are dependency-free (node:test) and touch no native modules, so we can
# skip install scripts here and avoid downloading Electron.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
